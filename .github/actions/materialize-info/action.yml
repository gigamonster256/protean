name: materialize-info
description: Install nix and materialize info.yaml from info.nix (which is the source of truth, info.yaml is gitignored)
runs:
  using: composite
  steps:
    - name: Install nix
      uses: cachix/install-nix-action@v31
      with:
        github_access_token: ${{ github.token }}

    - name: Materialize info.yaml from info.nix
      shell: bash
      run: nix run .#materialize-info
