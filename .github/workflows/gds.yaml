name: gds

on:
  push:
  workflow_dispatch:

jobs:
  gds:
    runs-on: ubuntu-24.04
    steps:
      - name: checkout repo
        uses: actions/checkout@v6
        with:
          submodules: recursive

      # info.yaml is gitignored - materialize it from info.nix first (installs nix)
      - name: Materialize info.yaml
        uses: ./.github/actions/materialize-info

      # Design source is Hardcaml (hw/); generate src/project.v for hardening
      # via the same nix closure used locally (`nix build .#verilog`).
      - name: Generate Verilog from Hardcaml
        shell: bash
        run: |
          nix build .#verilog --out-link verilog-result
          # TT hardening reads sources from src/ - copy the generated file over
          mkdir -p src
          cp verilog-result/project.v src/project.v

      - name: Build GDS
        uses: TinyTapeout/tt-gds-action@ihp-cmos5l
        with:
          pdk: ihp-sg13cmos5l

  precheck:
    needs: gds
    runs-on: ubuntu-24.04
    steps:
      - name: Run Tiny Tapeout Precheck
        uses: TinyTapeout/tt-gds-action/precheck@ihp-cmos5l

  gl_test:
    needs: gds
    runs-on: ubuntu-24.04
    steps:
      - name: checkout repo
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: GL test
        uses: TinyTapeout/tt-gds-action/gl_test@ihp-cmos5l

  viewer:
    needs: gds
    runs-on: ubuntu-24.04
    permissions:
      pages: write # to deploy to Pages
      id-token: write # to verify the deployment originates from an appropriate source
    steps:
      - uses: TinyTapeout/tt-gds-action/viewer@ihp-cmos5l
