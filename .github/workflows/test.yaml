name: test
on: [push, workflow_dispatch]
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repo
        uses: actions/checkout@v6

      - name: Install nix
        uses: cachix/install-nix-action@v31
        with:
          # Pin to Nix 2.34 to match the local machine (see materialize-info).
          install_url: https://releases.nixos.org/nix/nix-2.34.8/install
          github_access_token: ${{ github.token }}

      # Single source of truth: nix build runs Hardcaml -> Verilog -> cocotb
      # RTL sim using the exact closure `nix develop` gives you locally (no
      # separate opam switch or pip install). Upstream Nix (not Determinate) is
      # used so flake.lock NAR hashes match the local machine.
      - name: Build + run RTL tests
        run: nix build .#rtl-test --out-link result

      - name: Test Summary
        uses: test-summary/action@v2.4
        with:
          paths: "result/results.xml"
        if: always()

      - name: Upload waveform and test results
        if: success() || failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: |
            result/tb.fst
            result/results.xml
