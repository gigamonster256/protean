name: docs

on:
  push:
  workflow_dispatch:

jobs:
  docs:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repo
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Materialize info.yaml
        uses: ./.github/actions/materialize-info

      - name: Build docs
        uses: TinyTapeout/tt-gds-action/docs@ihp-cmos5l
